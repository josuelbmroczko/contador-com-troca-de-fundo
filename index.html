<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    body{
        
        background-color: aquamarine;
                display: flex;
                justify-content: space-around;

    }
    .minha-caixa{
        width: 300px;
        background-color: aliceblue;
        display: flex;
                justify-content: space-around;
                flex-direction: column;
                text-align: start;
                border-radius: 50px 0 50px 0;
                
    }.minha-caixa:hover{
        width: 400px;
        transition: all 2s;
    }
    button{
        position: relative;
        display: flex;
        justify-content: center;
        background-color: tomato;
        color: white;
        margin-left: 5%;
        margin-right:  5%;
        margin-top: 5px;
        border-radius: 15px;
        
    }button:hover{
        margin-left: 15%;
        margin-right:  15%;
        transition: all 100ms;
    }
</style>


<body id="cordefundo">
    <div class="minha-caixa">
    <button id="somar">somar</button>
    <button id="subtrair">subtrair</button>
    <p id="numero">0</p>

    <label for="nome">nome:</label>
    <input type="text" id="nome" placeholder="seu nome">
    <button id="botaoNome">adionar Nome: </button>

    <p id="resultado"></p>
</div>
</body>

<script>
        const nome = document.getElementById("nome")
        const botaoNome = document.getElementById("botaoNome")
        const resultado = document.getElementById("resultado")
        const guardarnome =[]
        botaoNome.addEventListener("click",()=>{
            const resultnomneDapessia = nome.value
            guardarnome.push(resultnomneDapessia)
            resultado.innerHTML=guardarnome
        })

        const somar = document.getElementById("somar")
        const subtrair = document.getElementById("subtrair")

        let contador = 0
        let numero = document.getElementById("numero")

        function ChamarCor(eventoaqui){
            document.body.style.backgroundColor=eventoaqui
        }

        function MudarFundo(){
            if(contador >= 10){
                ChamarCor("blue")
            }else if(contador >= 5){
                 ChamarCor("red")
            }else{
                 ChamarCor("yellow")
            }
        }

        somar.addEventListener("click",()=>{
            contador++
            numero.innerHTML=contador
            MudarFundo()
})

        
</script>

</html>
